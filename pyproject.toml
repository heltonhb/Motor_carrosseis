[project]
name = "motor-carrosseis"
version = "0.1.0"
description = "Motor de Carrosséis — Ensina Mais Tatuapé"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.22.0",
    "pandas>=2.2.0",
    "pillow>=12.3.0",
    "streamlit>=1.63.0",
]

[tool.setuptools]
py-modules = ["app", "config", "gemini", "image_utils", "notebooklm_client", "persistence", "prompts", "templates", "parser_nlm", "batch_engine"]

[tool.pytest.ini_options]
testpaths = ["test_parser_nlm.py", "test_batch_engine.py", "test_image_fix.py"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line-length: código legado tem linhas longas; será resolvido no E1
    "B008",  # Streamlit usa call defaults (st.button etc.) por design
]
